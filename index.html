<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<title>用紙データベース</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>用紙データベース</h1>
  <button id="searchToggle" class="icon-btn" aria-label="名前で検索">🔍</button>
</header>

<div id="searchBar" class="search-bar hidden">
  <input id="searchInput" type="text" inputmode="search" placeholder="銘柄名・メーカーで検索">
</div>

<main>

  <section class="dial-card">
    <div class="dial-wrap">
      <svg id="dialSvg" viewBox="0 0 240 240" class="dial-svg">
        <path id="dialTrack" class="dial-track"></path>
        <path id="dialFill" class="dial-fill"></path>
        <circle id="dialHandle" class="dial-handle" r="13"></circle>
      </svg>
      <div class="dial-center">
        <div class="dial-value" id="dialValue">--</div>
        <div class="dial-unit">μm</div>
        <div class="dial-sub" id="dialSub">紙厚をダイヤルで選択</div>
      </div>
    </div>

    <div class="dial-labels">
      <span>薄い</span>
      <span>厚い</span>
    </div>

    <div class="dial-controls">
      <div class="tolerance-group">
        <span class="tolerance-label">許容幅</span>
        <div class="seg-control" id="toleranceSeg">
          <button data-tol="10">±10</button>
          <button data-tol="15" class="active">±15</button>
          <button data-tol="25">±25</button>
          <button data-tol="9999">全部</button>
        </div>
      </div>
      <button id="dialReset" class="text-btn">絞り込み解除</button>
    </div>
  </section>

  <section class="filter-panel">
    <button id="filterToggle" class="filter-toggle">
      <span>絞り込み条件</span>
      <span id="filterSummary" class="filter-summary"></span>
      <span class="chevron" id="filterChevron">▾</span>
    </button>

    <div id="filterBody" class="filter-body hidden">
      <div class="filter-group">
        <div class="filter-group-title">分類</div>
        <div id="categoryChips" class="chip-row"></div>
      </div>
      <div class="filter-group">
        <div class="filter-group-title">メーカー</div>
        <div id="makerChips" class="chip-row"></div>
      </div>
      <div class="filter-group sort-group">
        <div class="filter-group-title">並び順</div>
        <div class="seg-control" id="sortSeg">
          <button data-sort="usage" class="active">人気順</button>
          <button data-sort="thickness">厚さが近い順</button>
        </div>
      </div>
    </div>
  </section>

  <div class="result-meta">
    <span id="resultCount">--件</span>
  </div>

  <section id="resultList" class="result-list"></section>

  <p class="footer-note">SAPI用紙マスターより生成 / 価格・在庫は参考値のため発注前に必ず最新情報を確認してください</p>
</main>

<script src="js/app.js"></script>
</body>
</html>
