<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ブック印刷のコト Re:Edit 表紙（仮）</title>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* 『ブック印刷のコト Re:Edit』表紙の仮デザイン（A4縦・仕上がりサイズ）
   写真は使わず、単色の面と大きな「Re:Edit」だけで構成 */
:root{--ink:#232323;--orange:#e2622c;--mustard:#e9a63f}
@page{size:210mm 297mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);background:#888;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cover{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff}
.kicker{position:absolute;top:13mm;left:13mm;font-size:10pt;font-weight:900;letter-spacing:.5em;color:var(--mustard)}
.logo{position:absolute;top:18mm;left:11mm;width:82mm}
.mascot{position:absolute;top:8mm;right:10mm;width:26mm}
.field{position:absolute;left:0;right:0;top:76mm;bottom:0;background:var(--orange)}
.torn{position:absolute;left:0;top:70mm;width:210mm;height:12mm;z-index:2}
.sou{position:absolute;top:47mm;left:15mm;color:var(--orange);font-size:12pt;font-weight:700;letter-spacing:.6em}
.re{position:absolute;top:53mm;left:13mm;color:var(--ink);font-family:"Yusei Magic",sans-serif;font-size:40pt;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.now{position:absolute;top:128mm;left:0;right:0;text-align:center;color:#fff;font-weight:900;font-size:152pt;line-height:.92;letter-spacing:-.03em}
</style>
</head>
<body>
<div class="cover">
  <span class="kicker">誰も教えてくれなかった</span>
  <img class="logo" src="assets/logo_bookinsatsu.png" alt="ブック印刷のコト">
  <img class="mascot" src="assets/cat_book.png" alt="">

  <div class="field"></div>
  <svg class="torn" viewBox="0 0 210 12" preserveAspectRatio="none"><path d="M0 0H210V4l-5 1.6-6-.8-5 1.4-7-1-4 1.2-6-.5-5 1.5-6-1-4 .8-7-.3-5 1.4-6-.8-5 1.1-5-.6-6 1.3-4-.9-7 1.2-5-.4-6 1-4-.7-7 1.4-5-.6-6 .9-4-.2-7 1.1-5-.8-5 1.2-6-.5-4 .9-7-.4-5 1.3-6-.7-5 1-6-.3-4 .8-6-.6-5 1.2-5-.5-6 .9-5-.6V0z" fill="#fff"/></svg>

  <span class="sou">総集編</span>
  <span class="re">Re:Edit</span>
  <p class="now">Now<br>Printing</p>

</div>
</body>
</html>
